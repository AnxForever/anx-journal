                - paragraph [ref=f2e1293]: Lorebox turns a shoebox of cards into an organized, valued collection — and it
                - paragraph [ref=f2e1294]: does it privately, right on your computer.
                - paragraph [ref=f2e1295]: Scan cards with a TWAIN scanner or import images and PDFs, and Lorebox
                - paragraph [ref=f2e1296]: automatically reads each card's name, set, number, year, and game. It estimates
                - paragraph [ref=f2e1297]: the card's condition, looks up an approximate market value, and files it into a
                - paragraph [ref=f2e1298]: searchable collection with dashboards, reports, and set-completion tracking.
                - paragraph [ref=f2e1299]: Built for collectors of sports cards and trading card games alike.
                - paragraph [ref=f2e1300]: WHAT YOU CAN DO
                - paragraph [ref=f2e1301]: • Identify cards automatically from a scan or photo
                - paragraph [ref=f2e1302]: • Get an estimated condition grade for every card
                - paragraph [ref=f2e1303]: • See approximate market values, adjusted for condition
                - paragraph [ref=f2e1304]: • Browse, search, and sort your whole collection
                - paragraph [ref=f2e1305]: • Import in bulk from folders or multi-page PDFs, pairing fronts and backs
                - paragraph [ref=f2e1306]: • Auto-import from a watch folder on a schedule
                - paragraph [ref=f2e1307]: • Track value over time, value by game, and set completion on a dashboard
                - paragraph [ref=f2e1308]: • Edit any card and rotate/straighten its scans
                - paragraph [ref=f2e1309]: • Export your collection to CSV anytime
                - paragraph [ref=f2e1310]: • Personalize the app with team-color themes
                - paragraph [ref=f2e1311]: • Adjustable text size, high-contrast mode, and keyboard navigation
                - paragraph [ref=f2e1312]: PRIVATE BY DESIGN
                - paragraph [ref=f2e1313]: Your collection lives in a local database on your PC. Lorebox has no accounts,
                - paragraph [ref=f2e1314]: no analytics, and no cloud. Card images and names are sent to identification and
                - paragraph [ref=f2e1315]: pricing services only when you use those features, using API keys you provide.
                - paragraph [ref=f2e1316]: BRING YOUR OWN KEYS
                - paragraph [ref=f2e1317]: Card identification uses the Anthropic (Claude) API, and pricing uses Scryfall
                - paragraph [ref=f2e1318]: and the eBay API. You add your own free/low-cost API keys in Settings, so you're
                - paragraph [ref=f2e1319]: always in control of usage and cost.
                - paragraph [ref=f2e1320]: PLEASE NOTE
                - paragraph [ref=f2e1321]: Estimated values and condition grades are automated and approximate. They are a
                - paragraph [ref=f2e1322]: helpful guide for organizing and exploring your collection — not guaranteed sale
                - paragraph [ref=f2e1323]: prices, professional appraisals, or a substitute for a professional grading
                - paragraph [ref=f2e1324]: service.
                - paragraph [ref=f2e1325]: Lorebox is open source (AGPL-3.0). Learn more at https://loreboxapp.dev
