                - paragraph [ref=f2e1407]: DasBook is a desktop writing environment built for authors who want the power of AI without surrendering creative control. Every AI agent connected to DasBook operates under strict authorship protection rules. The AI cannot invent plot points, create characters, or decide what happens in your story. It helps you research, structure, format, and refine your prose, but the ideas have to be yours. The story that comes out of DasBook is your story.
                - paragraph [ref=f2e1408]: What makes DasBook different from other AI writing tools is context awareness. When you ask the AI for help, it reads your actual scenes, character sheets, and world-building codex. You get specific, relevant feedback about your story instead of generic writing advice. And when the AI suggests changes to a scene or chapter, you review a side-by-side diff before anything is applied.
                - paragraph [ref=f2e1409]: DasBook gives you a full suite of professional writing tools in one place. Organize your work in a binder tree with books, chapters, scenes, characters, timelines, and research documents. Build your world in a searchable codex. Plan visually on a corkboard. Track word counts and targets per scene. Run a consistency checker that flags contradictions across your manuscript. When you are ready, publish directly to PDF or EPUB with full control over layout, fonts, and page size.
                - paragraph [ref=f2e1410]: Connect to the AI provider of your choice. Use Anthropic Claude for top-tier reasoning, any OpenAI-compatible API, or run models locally with Ollama for completely offline and private writing sessions. DasBook works with all of them.
                - paragraph [ref=f2e1411]: Whether you are outlining your first novel or deep into a multi-book series, DasBook keeps you in the driver's seat. The AI shapes the words. You shape the story.
