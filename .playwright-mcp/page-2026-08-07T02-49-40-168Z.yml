                - paragraph [ref=f2e934]: • Reads your real quota. Connects through the same ChatGPT login Codex already uses, reading remaining, used, total, and % left, with the last sync time.
                - paragraph [ref=f2e935]: • Smart notifications. Optional toasts at 80 / 90 / 95 / 99% used, plus exhausted and reset alerts, so a limit never surprises you mid-task.
                - paragraph [ref=f2e936]: • Feels like Windows. Follows your light/dark theme and Windows accent color automatically, with a Mica settings window and Segoe UI Variable typography.
                - paragraph [ref=f2e937]: • Featherweight. Timer-driven background polling, cached readings for instant startup, and near-zero idle CPU and RAM. No Electron, no webview — pure native WinUI 3 and Win32.
                - paragraph [ref=f2e938]: • Out of your way. Invisible when idle, optional system-tray icon (Refresh / Settings / Pause / Quit), and optional launch on sign-in.
                - paragraph [ref=f2e939]: TRY BEFORE YOU BUY
                - paragraph [ref=f2e940]: Codex Quota includes a free trial so you can see it live on your own taskbar before purchasing. One simple one-time purchase — no subscription.
