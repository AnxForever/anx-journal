              - generic [ref=f2e1227]:
                - paragraph [ref=f2e1228]: Das Medizinbuch ist der unverzichtbare Begleiter für alle, die regelmäßig Medikamente einnehmen müssen oder Ihre persönlichen Gesundheitsdaten immer griffbereit haben wollen. Zusätzlich ist das Medizinbuch mehrbenutzerfähig, sodass Sie nicht nur Ihre, sondern auch die Gesundheitsdaten ihrer ganzen Familie stets aktuell griffbereit haben.
                - paragraph [ref=f2e1229]: Alle persönlichen Gesundheitsdaten wie Erkrankungen, Arztbesuche, Krankenhausaufenthalte, Medikamenteneinnahmen, Zahnbehandlungen, Allergien, Blutdruck- und Blutzuckerwerte, Cholesterinwerte, Gewichts- und Temperaturwerte, Impfungen, Sehstärken und Blutspenden können für die ganze Familie erfasst werden. Grafiken und eigene Zieleinstellungen unterstützen Sie dabei zur Erreichung Ihrer Gesundheitsziele. Dazu können alle gesundheitsbezogenen Ausgaben und Kosten erfasst und ausgewertet werden. Dies ist insbesondere für Zuzahlungen hilfreich.
                - paragraph [ref=f2e1230]: Das Medizinbuch erinnert Sie an Medikamenteneinnahmen und Arzttermine über Benachrichtigung und Live Tile Darstellung. Zu Medikamenten, Allergien, Arzt- und Zahnarztbehandlungen und weiteren können Sie zusätzlich zu Ihren Eingaben Fotos und Bilder aufnehmen.
                - paragraph [ref=f2e1231]: Die auf dem PC, Tablet oder Smartphone eingegebenen Gesundheitsdaten können zwischen den Geräten synchronisiert werden, sodass Sie Ihre Gesundheitswerte immer aktuell bei sich haben. Neben einer Synchronisation über OneDrive steht auch ein Datenaustausch über Box zur Verfügung.
                - paragraph [ref=f2e1232]: Das Medizinbuch steht auch für Smartphones und Tablets mit anderen Betriebssystemen zur Verfügung.
                - paragraph [ref=f2e1233]: Alle Gesundheitsdaten können ausgedruckt, als Microsoft Excel und PDF Datei exportiert oder als E-Mail versendet werden. Zusätzlich können die Gesundheitswerte zu Ihren OneNote Notizen hinzugefügt werden.
