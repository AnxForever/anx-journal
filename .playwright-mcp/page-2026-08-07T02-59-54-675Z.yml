    - article [ref=f19e5]:
      - generic [ref=f19e6]:
        - generic [ref=f19e7]: Codex 零基础教程（一）：从微软商店下载 Codex 客户端
        - generic [ref=f19e8]:
          - generic [ref=f19e9]: "#Codex"
          - generic [ref=f19e10]: "#AI 编程"
          - generic [ref=f19e11]: "#新手教程"
          - generic [ref=f19e12]: "#ChatGPT"
        - generic [ref=f19e13]: 2026年 8月 7日
        - generic [ref=f19e14]:
          - paragraph [ref=f19e15]:
            - text: Codex 是 OpenAI 推出的 AI 编程助手。它和 ChatGPT 是同一个应用：
            - strong [ref=f19e16]: Codex 内嵌在 ChatGPT 桌面应用里
            - text: ，微软商店里没有单独的「Codex App」，这一点很多人第一次都会找错，下文会详细说明。
          - paragraph [ref=f19e17]: 本教程面向完全没接触过的新手，从下载安装开始，一步一步来。
          - paragraph [ref=f19e18]: 本文核对时间：2026-08-07。
          - heading "# 你需要准备什么" [level=2] [ref=f19e19]
          - list [ref=f19e20]:
            - listitem [ref=f19e21]:
              - text: 一台
              - strong [ref=f19e22]: Windows 10（2004 版及以上）或 Windows 11
              - text: 电脑
            - listitem [ref=f19e23]: 微软账号（登录微软商店用，Windows 自带的账号就行）
            - listitem [ref=f19e24]: ChatGPT 账号（安装后用，注册方法在下一篇教程里讲）
          - heading "# 第一步：打开微软商店" [level=2] [ref=f19e25]
          - paragraph [ref=f19e26]: 有两种方式：
          - paragraph [ref=f19e27]:
            - strong [ref=f19e28]: 方式一（推荐）
            - text: ：点击 Windows 任务栏左下角的开始菜单，搜索「Microsoft Store」，打开微软商店。
          - paragraph [ref=f19e29]:
            - strong [ref=f19e30]: 方式二
            - text: ：用浏览器打开商店网页版：
            - link "https://apps.microsoft.com" [ref=f19e31] [cursor=pointer]:
              - /url: https://apps.microsoft.com
          - heading "# 第二步：搜索 Codex" [level=2] [ref=f19e32]
          - paragraph [ref=f19e33]:
            - text: 在商店顶部的搜索框输入
            - code [ref=f19e34]: codex
            - text: ，按回车。你会看到类似下面的结果：
          - paragraph [ref=f19e35]:
            - img "在微软商店搜索 codex 的结果" [ref=f19e36] [cursor=pointer]
          - paragraph [ref=f19e37]:
            - strong [ref=f19e38]: 重点来了
            - text: ：搜索结果里排在第一位的是
            - strong [ref=f19e39]: ChatGPT
            - text: （发布者是 OpenAI），而不是名字叫「Codex」的应用。这是正常的——Codex 是 ChatGPT 应用内置的编程功能。
          - paragraph [ref=f19e40]:
            - text: 同时要注意：商店里有一些名字带 Codex 的
            - strong [ref=f19e41]: 无关应用
            - text: （比如 "Codex - QR Reader" 二维码工具），
            - strong [ref=f19e42]: 不要下载
            - text: 。认准两点：
          - list [ref=f19e43]:
            - listitem [ref=f19e44]:
              - text: 应用名是
              - strong [ref=f19e45]: ChatGPT
            - listitem [ref=f19e46]:
              - text: 发布者是
              - strong [ref=f19e47]: OpenAI
          - heading "# 第三步：点击「获取」安装" [level=2] [ref=f19e48]
          - paragraph [ref=f19e49]: 点击 ChatGPT 应用进入详情页，确认发布者是 OpenAI：
          - paragraph [ref=f19e50]:
            - img "ChatGPT 应用详情页" [ref=f19e51] [cursor=pointer]
          - paragraph [ref=f19e52]: 点击「获取」或「安装」按钮，等待下载完成。应用大小约 1.8 GB，视网速可能需要几分钟到几十分钟。
          - paragraph [ref=f19e53]:
            - text: 安装完成后，开始菜单里会出现
            - strong [ref=f19e54]: ChatGPT
            - text: 应用。
          - heading "# 第四步：打开应用" [level=2] [ref=f19e55]
          - paragraph [ref=f19e56]: 打开 ChatGPT 应用，会进入登录界面：
          - list [ref=f19e57]:
            - listitem [ref=f19e58]:
              - strong [ref=f19e59]: 已经有 ChatGPT 账号
              - text: ：直接登录，登录后左上角就能找到 Codex 入口
            - listitem [ref=f19e60]:
              - strong [ref=f19e61]: 还没有账号
              - text: ：先看本系列下一篇《注册 ChatGPT 账号（含手机号验证方法）》，注册完再回来登录
          - heading "# 常见问题" [level=2] [ref=f19e62]
          - heading "## 商店里搜不到 ChatGPT？" [level=3] [ref=f19e63]
          - list [ref=f19e64]:
            - listitem [ref=f19e65]: 确认系统是 Windows 10 2004 或更高版本（设置 → 系统 → 关于，查看版本号）
            - listitem [ref=f19e66]: 检查系统区域设置，商店服务在中国大陆可用，一般不需要改区域
            - listitem [ref=f19e67]:
              - text: 换用网页版：
              - link "https://apps.microsoft.com/detail/9plm9xgg6vks" [ref=f19e68] [cursor=pointer]:
                - /url: https://apps.microsoft.com/detail/9plm9xgg6vks
          - heading "## 下载太慢或卡住？" [level=3] [ref=f19e69]
          - list [ref=f19e70]:
            - listitem [ref=f19e71]: 微软商店下载依赖网络环境，可以稍后再试
            - listitem [ref=f19e72]: 打开「设置 → 更新和安全 → Windows 更新」确认系统已是最新，老版本系统会导致商店异常
          - heading "## 我下了一个叫 \"Codex\" 的应用，对吗？" [level=3] [ref=f19e73]
          - paragraph [ref=f19e74]:
            - text: 大概率不对。商店里绝大多数叫 Codex 的应用和 OpenAI 没有关系。请确认应用名是
            - strong [ref=f19e75]: ChatGPT
            - text: 、发布者是
            - strong [ref=f19e76]: OpenAI
            - text: ，再安装。
          - heading "# 下一步" [level=2] [ref=f19e77]
          - paragraph [ref=f19e78]: 安装完成后，你还需要：
          - list [ref=f19e79]:
            - listitem [ref=f19e80]: 注册 ChatGPT 账号（本系列第二篇，包含手机号验证的完整方法）
            - listitem [ref=f19e81]: 登录并找到 Codex 入口
            - listitem [ref=f19e82]: 用 Codex 开始你的第一个编程任务
          - heading "# 参考来源" [level=2] [ref=f19e83]
          - list [ref=f19e84]:
            - listitem [ref=f19e85]:
              - text: 微软商店 ChatGPT 应用页：
              - link "https://apps.microsoft.com/detail/9plm9xgg6vks" [ref=f19e86] [cursor=pointer]:
                - /url: https://apps.microsoft.com/detail/9plm9xgg6vks
            - listitem [ref=f19e87]:
              - text: OpenAI Codex 官网：
              - link "https://openai.com/codex/" [ref=f19e88] [cursor=pointer]:
                - /url: https://openai.com/codex/
