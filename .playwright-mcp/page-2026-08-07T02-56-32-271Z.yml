            - generic [ref=f16e7]: Codex 零基础教程（一）：从微软商店下载 Codex 客户端
            - generic [ref=f16e8]:
              - generic [ref=f16e9]: "#Codex"
              - generic [ref=f16e10]: "#AI 编程"
              - generic [ref=f16e11]: "#新手教程"
              - generic [ref=f16e12]: "#ChatGPT"
            - generic [ref=f16e13]: 2026年 8月 7日
            - generic [ref=f16e14]:
              - paragraph [ref=f16e15]:
                - text: Codex 是 OpenAI 推出的 AI 编程助手。它和 ChatGPT 是同一个应用：
                - strong [ref=f16e16]: Codex 内嵌在 ChatGPT 桌面应用里
                - text: ，微软商店里没有单独的「Codex App」，这一点很多人第一次都会找错，下文会详细说明。
              - paragraph [ref=f16e17]: 本教程面向完全没接触过的新手，从下载安装开始，一步一步来。
              - paragraph [ref=f16e18]: 本文核对时间：2026-08-07。
              - heading "# 你需要准备什么" [level=2] [ref=f16e19]
              - list [ref=f16e20]:
                - listitem [ref=f16e21]:
                  - text: 一台
                  - strong [ref=f16e22]: Windows 10（2004 版及以上）或 Windows 11
                  - text: 电脑
                - listitem [ref=f16e23]: 微软账号（登录微软商店用，Windows 自带的账号就行）
                - listitem [ref=f16e24]: ChatGPT 账号（安装后用，注册方法在下一篇教程里讲）
              - heading "# 第一步：打开微软商店" [level=2] [ref=f16e25]
              - paragraph [ref=f16e26]: 有两种方式：
              - paragraph [ref=f16e27]:
                - strong [ref=f16e28]: 方式一（推荐）
                - text: ：点击 Windows 任务栏左下角的开始菜单，搜索「Microsoft Store」，打开微软商店。
              - paragraph [ref=f16e29]:
                - strong [ref=f16e30]: 方式二
                - text: ：用浏览器打开商店网页版：
                - link "https://apps.microsoft.com" [ref=f16e31] [cursor=pointer]:
                  - /url: https://apps.microsoft.com
              - heading "# 第二步：搜索 Codex" [level=2] [ref=f16e32]
              - paragraph [ref=f16e33]:
                - text: 在商店顶部的搜索框输入
                - code [ref=f16e34]: codex
                - text: ，按回车。你会看到类似下面的结果：
              - paragraph [ref=f16e35]:
                - img "在微软商店搜索 codex 的结果" [ref=f16e36] [cursor=pointer]
              - paragraph [ref=f16e37]:
                - strong [ref=f16e38]: 重点来了
                - text: ：搜索结果里排在第一位的是
                - strong [ref=f16e39]: ChatGPT
                - text: （发布者是 OpenAI），而不是名字叫「Codex」的应用。这是正常的——Codex 是 ChatGPT 应用内置的编程功能。
              - paragraph [ref=f16e40]:
                - text: 同时要注意：商店里有一些名字带 Codex 的
                - strong [ref=f16e41]: 无关应用
                - text: （比如 "Codex - QR Reader" 二维码工具），
                - strong [ref=f16e42]: 不要下载
                - text: 。认准两点：
              - list [ref=f16e43]:
                - listitem [ref=f16e44]:
                  - text: 应用名是
                  - strong [ref=f16e45]: ChatGPT
                - listitem [ref=f16e46]:
                  - text: 发布者是
                  - strong [ref=f16e47]: OpenAI
              - heading "# 第三步：点击「获取」安装" [level=2] [ref=f16e48]
              - paragraph [ref=f16e49]: 点击 ChatGPT 应用进入详情页，确认发布者是 OpenAI：
              - paragraph [ref=f16e50]:
                - img "ChatGPT 应用详情页" [ref=f16e51] [cursor=pointer]
              - paragraph [ref=f16e52]: 点击「获取」或「安装」按钮，等待下载完成。应用大小约 1.8 GB，视网速可能需要几分钟到几十分钟。
              - paragraph [ref=f16e53]:
                - text: 安装完成后，开始菜单里会出现
                - strong [ref=f16e54]: ChatGPT
                - text: 应用。
              - heading "# 第四步：打开应用" [level=2] [ref=f16e55]
              - paragraph [ref=f16e56]: 打开 ChatGPT 应用，会进入登录界面：
              - list [ref=f16e57]:
                - listitem [ref=f16e58]:
                  - strong [ref=f16e59]: 已经有 ChatGPT 账号
                  - text: ：直接登录，登录后左上角就能找到 Codex 入口
                - listitem [ref=f16e60]:
                  - strong [ref=f16e61]: 还没有账号
                  - text: ：先看本系列下一篇《注册 ChatGPT 账号（含手机号验证方法）》，注册完再回来登录
              - heading "# 常见问题" [level=2] [ref=f16e62]
              - heading "## 商店里搜不到 ChatGPT？" [level=3] [ref=f16e63]
              - list [ref=f16e64]:
                - listitem [ref=f16e65]: 确认系统是 Windows 10 2004 或更高版本（设置 → 系统 → 关于，查看版本号）
                - listitem [ref=f16e66]: 检查系统区域设置，商店服务在中国大陆可用，一般不需要改区域
                - listitem [ref=f16e67]:
                  - text: 换用网页版：
                  - link "https://apps.microsoft.com/detail/9plm9xgg6vks" [ref=f16e68] [cursor=pointer]:
                    - /url: https://apps.microsoft.com/detail/9plm9xgg6vks
              - heading "## 下载太慢或卡住？" [level=3] [ref=f16e69]
              - list [ref=f16e70]:
                - listitem [ref=f16e71]: 微软商店下载依赖网络环境，可以稍后再试
                - listitem [ref=f16e72]: 打开「设置 → 更新和安全 → Windows 更新」确认系统已是最新，老版本系统会导致商店异常
              - heading "## 我下了一个叫 \"Codex\" 的应用，对吗？" [level=3] [ref=f16e73]
              - paragraph [ref=f16e74]:
                - text: 大概率不对。商店里绝大多数叫 Codex 的应用和 OpenAI 没有关系。请确认应用名是
                - strong [ref=f16e75]: ChatGPT
                - text: 、发布者是
                - strong [ref=f16e76]: OpenAI
                - text: ，再安装。
              - heading "# 下一步" [level=2] [ref=f16e77]
              - paragraph [ref=f16e78]: 安装完成后，你还需要：
              - list [ref=f16e79]:
                - listitem [ref=f16e80]: 注册 ChatGPT 账号（本系列第二篇，包含手机号验证的完整方法）
                - listitem [ref=f16e81]: 登录并找到 Codex 入口
                - listitem [ref=f16e82]: 用 Codex 开始你的第一个编程任务
              - heading "# 参考来源" [level=2] [ref=f16e83]
              - list [ref=f16e84]:
                - listitem [ref=f16e85]:
                  - text: 微软商店 ChatGPT 应用页：
                  - link "https://apps.microsoft.com/detail/9plm9xgg6vks" [ref=f16e86] [cursor=pointer]:
                    - /url: https://apps.microsoft.com/detail/9plm9xgg6vks
                - listitem [ref=f16e87]:
                  - text: OpenAI Codex 官网：
                  - link "https://openai.com/codex/" [ref=f16e88] [cursor=pointer]:
                    - /url: https://openai.com/codex/
